<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - EmailJS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #243244;
      --focus: #38bdf8;
      --button: #2563eb;
      --button-hover: #1d4ed8;
      --success-bg: #052e1f;
      --success-text: #86efac;
      --error-bg: #3f1d1d;
      --error-text: #fca5a5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% 0%, #1e293b 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 100%, #1d4ed8 0%, transparent 55%),
        var(--bg);
      color: var(--text);
    }

    .contact-card {
      width: min(100%, 720px);
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 55px rgba(2, 8, 23, 0.45);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.2rem);
      letter-spacing: 0.3px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.9rem;
      color: #dbeafe;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0b1220;
      color: var(--text);
      padding: 12px 14px;
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .hint {
      min-height: 20px;
      margin-top: 6px;
      font-size: 0.92rem;
      border-radius: 10px;
      padding: 8px 10px;
      display: none;
    }

    .hint.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(134, 239, 172, 0.35);
    }

    .hint.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(252, 165, 165, 0.35);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--button);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 11px 20px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--button-hover);
    }

    button:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .error-text {
      color: #fca5a5;
      font-size: 0.8rem;
      min-height: 15px;
      margin-top: -2px;
    }

    @media (max-width: 680px) {
      .contact-card { padding: 18px; border-radius: 16px; }
      .grid { grid-template-columns: 1fr; gap: 0; }
      .actions { justify-content: stretch; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <section class="contact-card">
    <h1>Contact Us</h1>
    <p class="subtitle">Fill out the form below and we will get back to you shortly.</p>

    <form id="contactForm" novalidate>
      <div class="grid">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your full name" required />
          <div class="error-text" id="nameError"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
          <div class="error-text" id="emailError"></div>
        </div>
      </div>

      <div class="field">
        <label for="title">Subject</label>
        <input id="title" name="title" type="text" placeholder="Subject title" required />
        <div class="error-text" id="titleError"></div>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
        <div class="error-text" id="messageError"></div>
      </div>

      <div id="formHint" class="hint" aria-live="polite"></div>

      <div class="actions">
        <button id="submitBtn" type="submit">Send Message</button>
      </div>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    emailjs.init({ publicKey: "hVmdeobpbsQfwehut" });

    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const hint = document.getElementById("formHint");

    const fields = [
      { id: "name", errorId: "nameError", label: "Name" },
      { id: "email", errorId: "emailError", label: "Email" },
      { id: "title", errorId: "titleError", label: "Subject" },
      { id: "message", errorId: "messageError", label: "Message" }
    ];

    function setHint(type, text) {
      hint.className = "hint " + type;
      hint.textContent = text;
    }

    function clearHint() {
      hint.className = "hint";
      hint.textContent = "";
    }

    function validateEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function validateForm() {
      let isValid = true;
      clearHint();

      for (const item of fields) {
        const input = document.getElementById(item.id);
        const error = document.getElementById(item.errorId);
        const value = input.value.trim();
        error.textContent = "";

        if (!value) {
          error.textContent = item.label + " is required.";
          isValid = false;
        }
      }

      const emailValue = document.getElementById("email").value.trim();
      const emailError = document.getElementById("emailError");
      if (emailValue && !validateEmail(emailValue)) {
        emailError.textContent = "Please enter a valid email address.";
        isValid = false;
      }

      return isValid;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!validateForm()) {
        setHint("error", "Please fix the highlighted fields.");
        return;
      }

      submitBtn.disabled = true;
      const previousText = submitBtn.textContent;
      submitBtn.textContent = "Sending...";
      clearHint();

      try {
        await emailjs.sendForm(
          "service_nzumzu7",
          "template_jpd6i4b",
          form
        );
        setHint("success", "Message sent successfully!");
        form.reset();
      } catch (error) {
        setHint("error", "Failed to send message. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = previousText;
      }
    });
  </script>
</body>
</html>
